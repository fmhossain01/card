<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add-TO-Card</title>
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/add_to_card.css">
</head>
<body>
    <section id="add_to_card">
        <div class="card">
            <div class="header">
                <div class="logo">
                    <img src="./images/logo.png" alt="">
                </div>
                <div class="icon">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>
            </div>
            <div class="img">
                <img src="./images/shoes.png" alt="">
            </div>
            <div class="info">

                    <h3>ADDIDAS GAZE ZX</h3>
                    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Eum, ea, ducimus!</p>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-solid fa-star"></i>
                    <i class="fa-regular fa-star"></i>
                </div>
                <div class="cp">
                  <div class="color">
                    <span>color :</span>
                    <input type="radio" name="color" checked/>
                    <input type="radio" name="color" />
                    <input type="radio" name="color" />
                  </div>
                  <div class="price">
                    <h4>$09.00</h4>

                    <button>Add To Card</button>
